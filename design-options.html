<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Layouts on Alive — Kamille Aerron De Guzman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:Inter,system-ui,sans-serif;background:#faf8f4;overflow-x:hidden}
  #stage{min-height:100vh}
  img{max-width:100%;display:block}

  /* ---------- PICKER (verbatim from PICKER.md) ---------- */
  .proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
  .proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12)}
  .proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}
  @media (prefers-reduced-motion: reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}}
  .proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit;cursor:pointer;transition:color 150ms ease-out,transform 160ms cubic-bezier(.23,1,.32,1)}
  @media (hover:hover) and (pointer:fine){.proto-picker-item:hover{color:rgba(255,255,255,.85)}}
  .proto-picker-item:active{transform:scale(.97)}
  .proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,.4);outline-offset:2px}
  .proto-picker-item[data-active]{color:#fff}
  .proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,.12)}
  .proto-picker-replay{padding:0 10px;font-size:14px}

  /* ============ shared: your palette + Alive's motion ============ */
  .v{--bg:#faf8f4;--ink:#1c1f24;--dim:#5b6270;--accent:#1f5f5b;--accent2:#3f9a92;--sand:#efe9dd;
     background:var(--bg);color:var(--ink);padding-bottom:180px;position:relative}
  .v .bar{display:flex;justify-content:space-between;align-items:center;padding:26px 40px;font-size:14px;color:var(--dim)}
  .v .bar b{color:var(--ink);font-weight:600}
  .v .wrap{max-width:1180px;margin:0 auto;padding:0 40px;position:relative}
  .v h1{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.04em;line-height:.9;margin:0;font-size:clamp(44px,8.4vw,112px)}
  .v .dek{font-size:18px;line-height:1.62;color:var(--dim);max-width:40ch}
  .v .figs{display:flex;gap:34px;flex-wrap:wrap}
  .v .figs b{font-family:Fraunces,serif;font-size:46px;display:block;line-height:1;color:var(--accent)}
  .v .figs span{font-size:13px;color:var(--dim);display:block;margin-top:6px;max-width:14ch}
  .v .cap b{display:block;font-family:Fraunces,serif;font-size:21px;margin-bottom:6px;font-weight:600}
  .v .cap span{color:var(--dim);font-size:15.5px;line-height:1.56}

  /* Alive's motion, identical everywhere */
  @keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
  .v .r{animation:rise .7s cubic-bezier(.16,1,.3,1) both}
  .v .marquee{overflow:hidden;white-space:nowrap;max-width:100%;min-width:0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
  .v .track{display:inline-flex;gap:14px;animation:slide 34s linear infinite}
  @keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .v .track span{background:#fff;border-radius:999px;padding:9px 17px;font-size:14.5px;color:var(--dim)}
  .v .frame{border-radius:10px;overflow:hidden;box-shadow:0 20px 50px rgba(28,31,36,.14);transition:transform .5s cubic-bezier(.16,1,.3,1)}
  .v .tilt{perspective:1200px}
  .v .tilt:hover .frame{transform:rotateX(2.2deg) rotateY(-2.2deg) scale(1.012)}
  @media (prefers-reduced-motion:reduce){
    .v .r{animation:none}.v .track{animation:none}
    .v [data-par]{transform:none!important}.v .tilt:hover .frame{transform:none}
  }

  /* ---------- A. SHOWCASE: one hero project, then the rest staggered ---------- */
  .sa .top{padding:40px 0 0;display:grid;grid-template-columns:1.3fr .7fr;gap:46px;align-items:end}
  .sa .marquee{margin:76px 0 0}
  .sa .lead{margin:96px 0 0}
  .sa .lead .cap{margin-top:26px;display:grid;grid-template-columns:1fr 1.5fr;gap:36px}
  .sa .more{margin:116px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:64px 44px}
  .sa .more > div:nth-child(even){margin-top:76px}
  .sa .more .cap{margin-top:18px}
  @media(max-width:860px){.sa .top,.sa .lead .cap,.sa .more{grid-template-columns:1fr;gap:24px}.sa .more > div:nth-child(even){margin-top:0}}

  /* ---------- B. INDEX: typographic list, preview follows the cursor ---------- */
  .sb .top{padding:40px 0 0}
  .sb .top .dek{margin:28px 0 0}
  .sb .marquee{margin:66px 0 0}
  .sb .idx{margin:104px 0 0;border-top:1px solid #e4e2dc}
  .sb .row{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;padding:30px 4px;border-bottom:1px solid #e4e2dc;cursor:pointer;transition:padding-left .4s cubic-bezier(.16,1,.3,1),color .3s}
  .sb .row h3{font-family:Fraunces,serif;font-weight:600;font-size:clamp(24px,3.6vw,46px);margin:0;letter-spacing:-.03em;transition:color .3s}
  .sb .row em{font-style:normal;font-size:14px;color:var(--dim);white-space:nowrap}
  .sb .row:hover{padding-left:26px}
  .sb .row:hover h3{color:var(--accent)}
  .sb .row .thumb{display:none}
  .sb .peek{position:fixed;width:400px;pointer-events:none;z-index:40;opacity:0;transform:translate(-50%,-50%) scale(.96);transition:opacity .25s ease-out,transform .35s cubic-bezier(.16,1,.3,1)}
  .sb .peek.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .sb .peek img{border-radius:8px;box-shadow:0 26px 60px rgba(28,31,36,.26)}
  @media(max-width:860px),(hover:none){
    .sb .peek{display:none}
    .sb .row{grid-template-columns:1fr;padding:22px 0}
    .sb .row .thumb{display:block;margin-top:14px;border-radius:8px;overflow:hidden}
  }

  /* ---------- C. SPLIT RAIL: sticky profile left, work scrolls right ---------- */
  .sc .shell{display:grid;grid-template-columns:.82fr 1.18fr;gap:60px;padding-top:40px;align-items:start}
  .sc .shell > *{min-width:0}
  .sc .rail{position:sticky;top:38px}
  .sc .rail .figs{margin-top:34px;flex-direction:column;gap:22px}
  .sc .rail .marquee{margin-top:36px}
  .sc .feed > div{margin-bottom:86px}
  .sc .feed .cap{margin-top:18px}
  @media(max-width:900px){.sc .shell{grid-template-columns:1fr;gap:40px}.sc .rail{position:static}.sc .rail .figs{flex-direction:row}}
</style>
</head>
<body>

<div id="stage"></div>

<nav class="proto-picker" aria-label="Layout variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Showcase</button>
  <button class="proto-picker-item">Index</button>
  <button class="proto-picker-item">Split rail</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>

<script>
const I = {
  ads:    'images/xfactor-meta-ads-manager.png',
  report: 'images/a4f5c14f59dd4ba1a0cb78e819d985bd.jpg',
  help:   'images/ccc3aa7cd38f493d93568e855cd219b0.jpg',
  click:  'images/bluewater-onboarding-templates.png'
};
const TOOLS = ['GoHighLevel','Shopify','Tevello','Mantle','Google Sheets','ClickUp','Basecamp','Canva','Metricool','Claude','ChatGPT','MCP connectors','Kajabi','Teachable','Podia'];
const BAR = `<div class="bar"><b>Kamille De Guzman</b><span>Marketing operations &middot; Remote, Philippines</span></div>`;
const MARQ = `<div class="marquee r" style="animation-delay:.22s"><div class="track">${[...TOOLS,...TOOLS].map(t=>`<span>${t}</span>`).join('')}</div></div>`;
const FIGS = `<div class="figs r" style="animation-delay:.14s">
  <div><b>25</b><span>customers migrated</span></div>
  <div><b>52</b><span>help articles</span></div>
  <div><b>13</b><span>platforms</span></div></div>`;

const WORK = [
  [I.ads,   'Meta ad account',    'Xfactor Method', '293 campaigns tracked on results, frequency, reach, CPM, CPC, CTR and ThruPlays, with the reporting dashboard built alongside it in Sheets.'],
  [I.report,'Weekly SaaS report', 'Tevello',        'Subscriptions, churn and MRR, plus the app listing to trial to paid funnel. It surfaced a churn issue that became a feature recommendation.'],
  [I.help,  'The help center',    'Tevello',        'All 52 published articles across Get Started, Courses, Communities and Members, with screenshots and tutorial videos.'],
  [I.click, 'Onboarding templates','Bluewater Cruising','Member onboarding checklists from 6 ClickUp templates, with every member’s data verified before handoff.']
];
const shot = ([src,title,org,text], delay=0) =>
  `<div class="tilt r" data-par="0.05" style="animation-delay:${delay}s">
     <div class="frame"><img src="${src}" alt="${title}" loading="lazy"></div>
     <div class="cap"><b>${title}</b><span>${org} — ${text}</span></div>
   </div>`;

const variants = [

/* ---------- A. SHOWCASE ---------- */
() => `<div class="v sa">${BAR}
  <div class="wrap">
    <div class="top"><h1 class="r">Marketing ops<br>that holds up<br>under audit.</h1>${FIGS}</div>
    ${MARQ}
    <div class="lead">${shot(WORK[0], .3)}</div>
    <div class="more">${WORK.slice(1).map((w,i)=>shot(w,.1*i)).join('')}</div>
  </div>
</div>`,

/* ---------- B. INDEX ---------- */
() => `<div class="v sb">${BAR}
  <div class="wrap">
    <div class="top">
      <h1 class="r">Marketing ops<br>that holds up<br>under audit.</h1>
      <p class="dek r" style="animation-delay:.1s">Course migrations onto Shopify, help center content, customer stories, and the weekly numbers behind them — for founder-led SaaS and online course businesses.</p>
    </div>
    ${MARQ}
    <div class="idx">
      ${WORK.map(([src,title,org,text]) => `
        <div class="row r" data-peek="${src}">
          <h3>${title}</h3><em>${org}</em>
          <img class="thumb" src="${src}" alt="${title}" loading="lazy">
        </div>`).join('')}
    </div>
  </div>
  <div class="peek"><img src="" alt=""></div>
</div>`,

/* ---------- C. SPLIT RAIL ---------- */
() => `<div class="v sc">${BAR}
  <div class="wrap shell">
    <div class="rail">
      <h1 class="r">Marketing<br>ops that<br>holds up.</h1>
      ${FIGS}
      ${MARQ}
    </div>
    <div class="feed">${WORK.map((w,i)=>shot(w,.08*i)).join('')}</div>
  </div>
</div>`
];

/* --- picker wiring (verbatim from PICKER.md) --- */
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0, parTargets = [];
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}
function onScroll() {
  if (reduced()) return;
  const h = innerHeight;
  for (const el of parTargets) {
    const r = el.getBoundingClientRect();
    if (r.bottom < -200 || r.top > h + 200) continue;
    const d = (r.top + r.height / 2 - h / 2) * parseFloat(el.dataset.par);
    el.style.transform = `translate3d(0, ${d.toFixed(1)}px, 0)`;
  }
}
function bindPeek() {
  const peek = document.querySelector('.peek');
  if (!peek || reduced()) return;
  const img = peek.querySelector('img');
  document.querySelectorAll('.row[data-peek]').forEach(row => {
    row.addEventListener('mouseenter', () => { img.src = row.dataset.peek; peek.classList.add('on'); });
    row.addEventListener('mouseleave', () => peek.classList.remove('on'));
  });
  addEventListener('mousemove', e => {
    peek.style.left = e.clientX + 'px';
    peek.style.top  = e.clientY + 'px';
  }, { passive: true });
}
function render(i) { stage.innerHTML = variants[i](); parTargets = [...document.querySelectorAll('[data-par]')]; bindPeek(); onScroll(); }
function mount(i) {
  stage.innerHTML = '';
  requestAnimationFrame(() => render(i));
  setTimeout(() => { if (!stage.innerHTML) render(i); }, 250);
}
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}
items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', () => { moveHighlight(); onScroll(); });
addEventListener('scroll', () => requestAnimationFrame(onScroll), { passive: true });
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});
const requested = parseInt(new URLSearchParams(location.search).get('v'), 10);
setActive(requested >= 1 && requested <= variants.length ? requested - 1 : 0);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
</body>
</html>
