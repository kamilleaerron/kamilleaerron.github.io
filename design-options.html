<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Studio, lighter — Kamille Aerron De Guzman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:Inter,system-ui,sans-serif;background:#efeee9}
  #stage{min-height:100vh}
  img{max-width:100%;display:block}

  /* ---------- PICKER (verbatim from PICKER.md) ---------- */
  .proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
  .proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12)}
  .proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}
  @media (prefers-reduced-motion: reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}}
  .proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit;cursor:pointer;transition:color 150ms ease-out,transform 160ms cubic-bezier(.23,1,.32,1)}
  @media (hover:hover) and (pointer:fine){.proto-picker-item:hover{color:rgba(255,255,255,.85)}}
  .proto-picker-item:active{transform:scale(.97)}
  .proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,.4);outline-offset:2px}
  .proto-picker-item[data-active]{color:#fff}
  .proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,.12)}
  .proto-picker-replay{padding:0 10px;font-size:14px}

  @keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
  .r{animation:rise .62s cubic-bezier(.16,1,.3,1) both}
  @media (prefers-reduced-motion:reduce){.r{animation:none}}

  /* ======== shared Studio bones: same layout, three grounds ======== */
  .sx{padding-bottom:150px}
  .sx .bar{display:flex;justify-content:space-between;align-items:center;padding:24px 36px;font-size:14px}
  .sx .bar b{font-weight:600}
  .sx .wrap{max-width:1180px;margin:0 auto;padding:0 36px}
  .sx h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(50px,10.2vw,138px);line-height:.88;letter-spacing:-.045em;margin:52px 0 0}
  .sx h1 em{font-style:normal}
  .sx .dek{display:grid;grid-template-columns:1fr 1fr;gap:50px;margin:46px 0 0;align-items:end}
  .sx .dek p{margin:0;font-size:18.5px;line-height:1.6;max-width:42ch}
  .sx .figs{display:flex;gap:44px;justify-content:flex-end;flex-wrap:wrap}
  .sx .figs b{font-family:Fraunces,serif;font-size:50px;display:block;line-height:1}
  .sx .figs span{font-size:13px;display:block;margin-top:7px;max-width:14ch}
  .sx .shot{margin:100px 0 0;position:relative}
  .sx .shot img{width:100%;border-radius:10px}
  .sx .shot .tag{position:absolute;left:0;bottom:-16px;font-weight:700;font-size:13px;padding:9px 16px;border-radius:999px}
  .sx .cap{margin:42px 0 0;display:grid;grid-template-columns:1fr 1.4fr;gap:40px}
  .sx .cap h3{font-family:Fraunces,serif;font-size:26px;margin:0;font-weight:600}
  .sx .cap p{margin:0;font-size:16.5px;line-height:1.62}
  .sx .svc{margin:120px 0 0;padding-top:16px}
  .sx .svc div{display:grid;grid-template-columns:1fr 1.5fr;gap:36px;padding:26px 0}
  .sx .svc h4{margin:0;font-size:20px;font-weight:600}
  .sx .svc p{margin:0;font-size:16px;line-height:1.6}
  @media(max-width:760px){.sx .dek,.sx .cap,.sx .svc div{grid-template-columns:1fr;gap:20px}.sx .figs{justify-content:flex-start;gap:30px}.sx .wrap{padding:0 22px}.sx .bar{padding:20px 22px}}

  /* ---- A. Paper: warm off-white, deep teal ---- */
  .sa{--bg:#faf8f3;--ink:#13201c;--dim:#5d6b66;--accent:#0d6b57;background:var(--bg);color:var(--ink)}
  .sa .bar{color:var(--dim)} .sa .bar b{color:var(--ink)}
  .sa h1 em{color:var(--accent)}
  .sa .dek p,.sa .cap p,.sa .svc p,.sa .figs span{color:var(--dim)}
  .sa .figs b{color:var(--accent)}
  .sa .shot .tag{background:var(--accent);color:#fff}
  .sa .svc{border-top:1px solid #e2e0d8}
  .sa .svc div{border-bottom:1px solid #e2e0d8}

  /* ---- B. Mint: pale green field, more colour ---- */
  .sb{--bg:#e9f2ee;--ink:#0f2621;--dim:#4d6760;--accent:#0a5e4c;background:var(--bg);color:var(--ink)}
  .sb .bar{color:var(--dim)} .sb .bar b{color:var(--ink)}
  .sb h1 em{color:var(--accent)}
  .sb .dek p,.sb .cap p,.sb .svc p,.sb .figs span{color:var(--dim)}
  .sb .figs b{color:var(--accent)}
  .sb .shot img{box-shadow:0 1px 0 rgba(10,94,76,.14)}
  .sb .shot .tag{background:var(--ink);color:#d9efe7}
  .sb .svc{border-top:1px solid #cfe0d9}
  .sb .svc div{border-bottom:1px solid #cfe0d9}

  /* ---- C. Bands: light page, dark only where the work is ---- */
  .sc{--bg:#f7f6f2;--ink:#14201d;--dim:#5b6a65;--accent:#0d6b57;background:var(--bg);color:var(--ink)}
  .sc .bar{color:var(--dim)} .sc .bar b{color:var(--ink)}
  .sc h1 em{color:var(--accent)}
  .sc .dek p,.sc .figs span{color:var(--dim)}
  .sc .figs b{color:var(--accent)}
  .sc .band{background:#0d1513;color:#eef2f0;margin-top:110px;padding:84px 0 96px}
  .sc .band .shot{margin-top:0}
  .sc .band .shot + .shot{margin-top:96px}
  .sc .band .cap h3{color:#fff}
  .sc .band .cap p{color:#93a09b}
  .sc .band .tag{background:#5fd3b2;color:#06211a}
  .sc .svc{border-top:1px solid #e3e1d9}
  .sc .svc div{border-bottom:1px solid #e3e1d9}
  .sc .svc p{color:var(--dim)}
</style>
</head>
<body>

<div id="stage"></div>

<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Paper</button>
  <button class="proto-picker-item">Mint</button>
  <button class="proto-picker-item">Bands</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>

<script>
const IMG = {
  ads:    'images/xfactor-meta-ads-manager.png',
  report: 'images/a4f5c14f59dd4ba1a0cb78e819d985bd.jpg',
  help:   'images/ccc3aa7cd38f493d93568e855cd219b0.jpg'
};

const BAR = `
  <div class="bar"><b>Kamille De Guzman</b><span>Remote &middot; Philippines</span></div>`;

const HERO = `
    <h1 class="r">Marketing ops<br>that <em>holds up</em><br>under audit.</h1>
    <div class="dek">
      <p class="r" style="animation-delay:.1s">I run marketing operations for founder-led SaaS and online course businesses — course migrations onto Shopify, help center content, customer stories, and the weekly numbers behind them.</p>
      <div class="figs r" style="animation-delay:.18s">
        <div><b>25</b><span>customers migrated</span></div>
        <div><b>52</b><span>help articles</span></div>
        <div><b>13</b><span>platforms</span></div>
      </div>
    </div>`;

const SHOTS = `
    <div class="shot r" style="animation-delay:.26s">
      <img src="${IMG.ads}" alt="Meta Ads Manager campaign view" loading="lazy">
      <span class="tag">Media buying &middot; Xfactor Method</span>
    </div>
    <div class="cap r"><h3>Meta ad account</h3><p>293 campaigns tracked on results, frequency, reach, CPM, CPC, CTR and ThruPlays, with the reporting dashboard built alongside it in Sheets. Campaign names blurred.</p></div>

    <div class="shot r"><img src="${IMG.report}" alt="Weekly SaaS metrics report" loading="lazy">
      <span class="tag">Reporting &middot; Tevello</span>
    </div>
    <div class="cap r"><h3>Weekly SaaS report</h3><p>Subscriptions, churn and MRR, plus the app listing to trial to paid funnel. It surfaced a churn issue that became a feature recommendation.</p></div>`;

const SVC = `
    <div class="svc">
      <div><h4>Operations and SaaS reporting</h4><p>Weekly KPI and funnel reports that show founders what changed and what needs attention.</p></div>
      <div><h4>CRM management and cleanup</h4><p>GoHighLevel audits, segmentation and reconciling records against your sheets.</p></div>
      <div><h4>Course migration and onboarding</h4><p>Courses and members onto Shopify from Kajabi, Teachable, Podia and others.</p></div>
    </div>`;

const flat = cls => `<div class="sx ${cls}">${BAR}<div class="wrap">${HERO}${SHOTS}${SVC}</div></div>`;

const variants = [
  () => flat('sa'),
  () => flat('sb'),
  () => `<div class="sx sc">${BAR}
      <div class="wrap">${HERO}</div>
      <div class="band"><div class="wrap">${SHOTS}</div></div>
      <div class="wrap">${SVC}</div>
    </div>`
];

/* --- picker wiring (verbatim from PICKER.md) --- */
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}
function mount(i) {
  stage.innerHTML = '';
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}
items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});
const requested = parseInt(new URLSearchParams(location.search).get('v'), 10);
setActive(requested >= 1 && requested <= variants.length ? requested - 1 : 0);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
</body>
</html>
