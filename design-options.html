<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Design directions — Kamille Aerron De Guzman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:Inter,system-ui,sans-serif;background:#111}
  #stage{min-height:100vh}
  img{max-width:100%;display:block}
  a{color:inherit}

  /* ---------- PICKER (verbatim from PICKER.md) ---------- */
  .proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
  .proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12)}
  .proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}
  @media (prefers-reduced-motion: reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}}
  .proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit;cursor:pointer;transition:color 150ms ease-out,transform 160ms cubic-bezier(.23,1,.32,1)}
  @media (hover:hover) and (pointer:fine){.proto-picker-item:hover{color:rgba(255,255,255,.85)}}
  .proto-picker-item:active{transform:scale(.97)}
  .proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,.4);outline-offset:2px}
  .proto-picker-item[data-active]{color:#fff}
  .proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,.12)}
  .proto-picker-replay{padding:0 10px;font-size:14px}

  /* ---------- shared entrance ---------- */
  @keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
  .r{animation:rise .62s cubic-bezier(.16,1,.3,1) both}
  @media (prefers-reduced-motion:reduce){.r{animation:none}}

  /* ================= 1. EDITORIAL ================= */
  .ed{--ink:#191714;--paper:#f6f1e6;--accent:#8a3f28;background:var(--paper);color:var(--ink);padding:0 0 140px}
  .ed .bar{display:flex;justify-content:space-between;align-items:baseline;padding:30px 40px;font-size:14px;letter-spacing:.02em}
  .ed .wrap{max-width:900px;margin:0 auto;padding:0 40px}
  .ed h1{font-family:"Instrument Serif",Fraunces,Georgia,serif;font-weight:400;font-size:clamp(56px,11vw,136px);line-height:.92;letter-spacing:-.02em;margin:40px 0 0}
  .ed .sub{font-family:"Instrument Serif",serif;font-style:italic;font-size:clamp(22px,3.2vw,36px);color:var(--accent);margin:18px 0 0}
  .ed .dek{font-size:19px;line-height:1.62;max-width:34em;margin:40px 0 0;column-count:1}
  .ed .figs{display:flex;gap:56px;margin:64px 0 0;flex-wrap:wrap}
  .ed .figs b{font-family:"Instrument Serif",serif;font-weight:400;font-size:62px;line-height:1;display:block}
  .ed .figs span{font-size:14px;max-width:15ch;display:block;margin-top:8px;color:#5c564d}
  .ed .plate{margin:110px 0 0}
  .ed .plate img{width:100%;border-radius:2px}
  .ed .cap{display:flex;gap:28px;margin-top:20px;align-items:baseline}
  .ed .cap h3{font-family:"Instrument Serif",serif;font-weight:400;font-size:27px;margin:0;flex:0 0 32%}
  .ed .cap p{margin:0;font-size:16px;line-height:1.6;color:#4e4940}
  .ed .svc{margin:120px 0 0}
  .ed .svc h2{font-family:"Instrument Serif",serif;font-weight:400;font-size:clamp(34px,5vw,58px);margin:0 0 44px}
  .ed .svc div{padding:26px 0;display:grid;grid-template-columns:1fr 1.3fr;gap:40px}
  .ed .svc h4{font-family:"Instrument Serif",serif;font-weight:400;font-size:23px;margin:0}
  .ed .svc p{margin:0;color:#4e4940;font-size:16.5px;line-height:1.6}
  @media(max-width:700px){.ed .cap,.ed .svc div{grid-template-columns:1fr;display:block}.ed .cap h3{margin-bottom:8px}.ed .svc h4{margin-bottom:6px}.ed .wrap{padding:0 22px}.ed .bar{padding:22px}}

  /* ================= 2. REPORT ================= */
  .rp{--ink:#101418;--bg:#fff;--line:#e6e9ec;--accent:#0b6b5f;background:var(--bg);color:var(--ink);padding-bottom:140px;font-feature-settings:"tnum" 1}
  .rp .bar{display:flex;justify-content:space-between;align-items:center;padding:16px 28px;border-bottom:1px solid var(--line);font-size:13px;font-weight:600}
  .rp .bar span{color:#6b7580;font-weight:500}
  .rp .wrap{max-width:1080px;margin:0 auto;padding:0 28px}
  .rp .top{display:grid;grid-template-columns:1.25fr .75fr;gap:60px;padding:72px 0 0;align-items:start}
  .rp h1{font-size:clamp(34px,4.4vw,54px);line-height:1.05;letter-spacing:-.03em;margin:0;font-weight:600}
  .rp .role{font-size:16px;color:#6b7580;margin:14px 0 0;font-weight:500}
  .rp .dek{font-size:17px;line-height:1.6;margin:26px 0 0;max-width:46ch;color:#36404a}
  .rp .meta{border-left:3px solid var(--accent);padding-left:18px}
  .rp .meta dt{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#8a939c;font-weight:600}
  .rp .meta dd{margin:3px 0 16px;font-size:15px;font-weight:500}
  .rp .kpi{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);margin:56px 0 0}
  .rp .kpi div{padding:22px 20px;border-right:1px solid var(--line)}
  .rp .kpi div:last-child{border-right:0}
  .rp .kpi b{font-size:38px;font-weight:600;letter-spacing:-.03em;display:block;line-height:1}
  .rp .kpi span{font-size:12.5px;color:#6b7580;display:block;margin-top:7px;line-height:1.35}
  .rp h2{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:#8a939c;margin:68px 0 0;font-weight:600}
  .rp .row{display:grid;grid-template-columns:150px 1fr 230px;gap:26px;padding:22px 0;border-bottom:1px solid var(--line);align-items:center}
  .rp .row:first-of-type{border-top:1px solid var(--line)}
  .rp .row img{width:150px;height:84px;object-fit:cover;object-position:top left;border:1px solid var(--line)}
  .rp .row h3{margin:0 0 5px;font-size:16.5px;font-weight:600}
  .rp .row p{margin:0;font-size:14.5px;color:#55606b;line-height:1.5}
  .rp .row em{font-style:normal;font-size:13px;color:#8a939c;display:block;text-align:right}
  .rp .row em b{display:block;font-size:22px;color:var(--ink);font-weight:600;letter-spacing:-.02em}
  @media(max-width:760px){.rp .top{grid-template-columns:1fr;gap:34px}.rp .kpi{grid-template-columns:repeat(2,1fr)}.rp .kpi div:nth-child(2){border-right:0}.rp .row{grid-template-columns:1fr;gap:12px}.rp .row img{width:100%;height:150px}.rp .row em{text-align:left}}

  /* ================= 3. STUDIO ================= */
  .st{--ink:#f2efe9;--bg:#0c100f;--dim:#8d978f;--accent:#5fd3b2;background:var(--bg);color:var(--ink);padding-bottom:150px;overflow:hidden}
  .st .bar{display:flex;justify-content:space-between;align-items:center;padding:24px 36px;font-size:14px;color:var(--dim)}
  .st .bar b{color:var(--ink);font-weight:600}
  .st .wrap{max-width:1180px;margin:0 auto;padding:0 36px}
  .st h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(52px,10.5vw,142px);line-height:.88;letter-spacing:-.045em;margin:52px 0 0}
  .st h1 em{font-style:normal;color:var(--accent)}
  .st .dek{display:grid;grid-template-columns:1fr 1fr;gap:50px;margin:46px 0 0;align-items:end}
  .st .dek p{margin:0;font-size:18.5px;line-height:1.6;color:var(--dim);max-width:42ch}
  .st .figs{display:flex;gap:44px;justify-content:flex-end;flex-wrap:wrap}
  .st .figs b{font-family:Fraunces,serif;font-size:50px;display:block;line-height:1;color:var(--accent)}
  .st .figs span{font-size:13px;color:var(--dim);display:block;margin-top:7px;max-width:14ch}
  .st .shot{margin:100px 0 0;position:relative}
  .st .shot img{width:100%;border-radius:10px;opacity:.94}
  .st .shot .tag{position:absolute;left:0;bottom:-16px;background:var(--accent);color:#06211a;font-weight:700;font-size:13px;padding:9px 16px;border-radius:999px}
  .st .cap{margin:42px 0 0;display:grid;grid-template-columns:1fr 1.4fr;gap:40px}
  .st .cap h3{font-family:Fraunces,serif;font-size:26px;margin:0;font-weight:600}
  .st .cap p{margin:0;color:var(--dim);font-size:16.5px;line-height:1.62}
  .st .svc{margin:120px 0 0;border-top:1px solid #1e2523;padding-top:16px}
  .st .svc div{display:grid;grid-template-columns:1fr 1.5fr;gap:36px;padding:26px 0;border-bottom:1px solid #1e2523}
  .st .svc h4{margin:0;font-size:20px;font-weight:600}
  .st .svc p{margin:0;color:var(--dim);font-size:16px;line-height:1.6}
  @media(max-width:760px){.st .dek,.st .cap,.st .svc div{grid-template-columns:1fr;gap:20px}.st .figs{justify-content:flex-start;gap:30px}.st .wrap{padding:0 22px}.st .bar{padding:20px 22px}}
</style>
</head>
<body>

<div id="stage"></div>

<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Editorial</button>
  <button class="proto-picker-item">Report</button>
  <button class="proto-picker-item">Studio</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>

<script>
const IMG = {

  ads:      'images/xfactor-meta-ads-manager.png',

const variants = [

// ---------- 1. EDITORIAL ----------
() => `
<div class="ed">

      <div><h4>CRM management and data cleanup</h4><p>GoHighLevel audits: merging duplicates, standardizing tags and fields, segmenting members and reconciling records against your sheets.</p></div>
      <div><h4>Course migration and customer onboarding</h4><p>Moving courses and members onto Shopify from Kajabi, Teachable, Podia and other platforms, then onboarding them.</p></div>
    </div>
  </div>
</div>`,

// ---------- 2. REPORT ----------
() => `
<div class="rp">
  <div class="bar"><div>Kamille Aerron De Guzman</div><span>Updated November 2026</span></div>
  <div class="wrap">
    <div class="top">
      <div>
        <h1 class="r">Marketing operations for founder-led SaaS and course businesses.</h1>

      <div><b>25</b><span>customers migrated</span></div>
      <div><b>52</b><span>help articles written</span></div>
      <div><b>13</b><span>platforms migrated from</span></div>

    <div class="row r"><img src="${IMG.help}" alt="Tevello help center" loading="lazy">
      <div><h3>Tevello help center</h3><p>All published articles across Get Started, Courses, Communities and Members, with screenshots and tutorial videos.</p></div>

    <div class="row r"><img src="${IMG.report}" alt="Weekly SaaS metrics report" loading="lazy">

      <em><b>293</b>campaigns in the account</em></div>
  </div>

// ---------- 3. STUDIO ----------
() => `
<div class="st">
  <div class="bar"><b>Kamille De Guzman</b><span>Remote &middot; Philippines</span></div>
  <div class="wrap">

    <div class="dek">

];

/* --- picker wiring (verbatim from PICKER.md) --- */
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}
function mount(i) {
  stage.innerHTML = '';
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}
items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});
const requested = parseInt(new URLSearchParams(location.search).get('v'), 10);
setActive(requested >= 1 && requested <= variants.length ? requested - 1 : 0);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
</body>
</html>
