<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Section layouts in Mint — Kamille Aerron De Guzman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:Inter,system-ui,sans-serif;background:#e9f2ee}
  #stage{min-height:100vh}
  img{max-width:100%;display:block}

  /* ---------- PICKER (verbatim from PICKER.md) ---------- */
  .proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
  .proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12)}
  .proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}
  @media (prefers-reduced-motion: reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}}
  .proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit;cursor:pointer;transition:color 150ms ease-out,transform 160ms cubic-bezier(.23,1,.32,1)}
  @media (hover:hover) and (pointer:fine){.proto-picker-item:hover{color:rgba(255,255,255,.85)}}
  .proto-picker-item:active{transform:scale(.97)}
  .proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,.4);outline-offset:2px}
  .proto-picker-item[data-active]{color:#fff}
  .proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,.12)}
  .proto-picker-replay{padding:0 10px;font-size:14px}

  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .r{animation:rise .6s cubic-bezier(.16,1,.3,1) both}
  @media (prefers-reduced-motion:reduce){.r{animation:none}}

  /* ============ MINT tokens, identical in all three ============ */
  .m{--bg:#e9f2ee;--ink:#0f2621;--dim:#4d6760;--accent:#0a5e4c;--line:#cfe0d9;
     background:var(--bg);color:var(--ink);padding-bottom:150px}
  .m .wrap{max-width:1140px;margin:0 auto;padding:0 36px}
  .m .bar{display:flex;justify-content:space-between;align-items:center;padding:24px 36px;font-size:14px;color:var(--dim)}
  .m .bar b{color:var(--ink);font-weight:600}
  .m h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(44px,8vw,104px);line-height:.9;letter-spacing:-.045em;margin:44px 0 0}
  .m h1 em{font-style:normal;color:var(--accent)}
  .m .dek{font-size:18px;line-height:1.6;color:var(--dim);max-width:44ch;margin:30px 0 0}
  .m h2{font-family:Fraunces,serif;font-weight:600;font-size:clamp(28px,3.6vw,44px);letter-spacing:-.03em;margin:0 0 30px;line-height:1.05}
  .m .tag{display:inline-block;background:var(--ink);color:#d9efe7;font-weight:700;font-size:12.5px;padding:8px 14px;border-radius:999px}
  .m figure{margin:0}
  .m figure img{width:100%;border-radius:9px}
  .m figcaption{margin-top:14px}
  .m figcaption b{display:block;font-family:Fraunces,serif;font-size:19px;margin-bottom:5px}
  .m figcaption span{color:var(--dim);font-size:15px;line-height:1.55}
  .m .chips{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
  .m .chips li{background:#d7e8e1;color:var(--accent);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:500}
  .m .when{color:var(--dim);font-size:14px;white-space:nowrap}
  .m .org{color:var(--accent);font-weight:600;font-size:15px;margin:4px 0 12px}
  .m ul.bul{margin:0;padding-left:19px;color:var(--dim);font-size:15.5px;line-height:1.6}
  .m ul.bul li{margin-bottom:6px}
  .m .sec{margin-top:118px}

  /* ---- A. Stacked: every section full width, one after another ---- */
  .a1 .job{padding:30px 0;border-top:1px solid var(--line)}
  .a1 .job .top{display:flex;justify-content:space-between;align-items:baseline;gap:20px}
  .a1 .job h3{font-family:Fraunces,serif;font-size:25px;margin:0;font-weight:600}
  .a1 .job .cols{columns:2;column-gap:46px;margin-top:10px}
  .a1 .plates{display:grid;gap:70px}
  .a1 .plates figcaption{display:grid;grid-template-columns:1fr 1.6fr;gap:30px;align-items:start}
  @media(max-width:760px){.a1 .job .cols{columns:1}.a1 .plates figcaption{grid-template-columns:1fr;gap:6px}}

  /* ---- B. Split: sticky section label left, content right ---- */
  .a2 .split{display:grid;grid-template-columns:230px 1fr;gap:56px;align-items:start}
  .a2 .split > h2{position:sticky;top:28px;margin:0;font-size:clamp(24px,2.6vw,33px)}
  .a2 .job{padding:24px 0;border-bottom:1px solid var(--line)}
  .a2 .job h3{font-family:Fraunces,serif;font-size:21px;margin:0 0 2px;font-weight:600}
  .a2 .shots{display:grid;grid-template-columns:1fr 1fr;gap:26px}
  .a2 .skillrow{display:grid;grid-template-columns:200px 1fr;gap:24px;padding:18px 0;border-bottom:1px solid var(--line);align-items:baseline}
  .a2 .skillrow h4{margin:0;font-size:16px;font-weight:600}
  @media(max-width:860px){.a2 .split{grid-template-columns:1fr;gap:22px}.a2 .split > h2{position:static}.a2 .shots,.a2 .skillrow{grid-template-columns:1fr}}

  /* ---- C. By client: role, bullets and its screenshots in one block ---- */
  .a3 .client{margin-top:104px;padding-top:30px;border-top:2px solid var(--ink)}
  .a3 .client .head{display:flex;justify-content:space-between;align-items:baseline;gap:20px;flex-wrap:wrap}
  .a3 .client h3{font-family:Fraunces,serif;font-size:clamp(26px,3.4vw,40px);margin:0;font-weight:600;letter-spacing:-.02em}
  .a3 .client .body{display:grid;grid-template-columns:1fr 1.45fr;gap:50px;margin-top:26px;align-items:start}
  .a3 .client .shots{display:grid;gap:34px}
  @media(max-width:860px){.a3 .client .body{grid-template-columns:1fr;gap:28px}}
</style>
</head>
<body>

<div id="stage"></div>

<nav class="proto-picker" aria-label="Section layout variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Stacked</button>
  <button class="proto-picker-item">Split</button>
  <button class="proto-picker-item">By client</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>

<script>
const I = {
  ads:    'images/xfactor-meta-ads-manager.png',
  report: 'images/a4f5c14f59dd4ba1a0cb78e819d985bd.jpg',
  help:   'images/ccc3aa7cd38f493d93568e855cd219b0.jpg',
  click:  'images/bluewater-onboarding-templates.png'
};

const HEAD = `
  <div class="bar"><b>Kamille De Guzman</b><span>Remote &middot; Philippines</span></div>
  <div class="wrap">
    <h1 class="r">Marketing ops<br>that <em>holds up</em><br>under audit.</h1>
    <p class="dek r" style="animation-delay:.1s">I run marketing operations for founder-led SaaS and online course businesses — course migrations onto Shopify, help center content, customer stories, and the weekly numbers behind them.</p>`;

const fig = (src, alt, title, text) =>
  `<figure class="r"><img src="${src}" alt="${alt}" loading="lazy"><figcaption><b>${title}</b><span>${text}</span></figcaption></figure>`;

const JOBS = [
  ['Digital Marketing and Operations Specialist','Tevello LLC &middot; Shopify app for online courses','Mar 2024 – Oct 2026',
   ['Migrated courses from 13 platforms for 25 customers; the largest covered 67 courses and 1,445 videos.',
    'Wrote all 52 help center articles, plus internal SOPs and setup guides.',
    'Built the weekly SaaS metrics and funnel report from Mantle and Google Sheets.',
    'Write the monthly customer newsletter since Nov 2024.']],
  ['CRM and Onboarding Systems Support','Bluewater Cruising &middot; membership programs','Jul 2025 – Oct 2026',
   ['Member onboarding and upgrades through ClickUp checklists from 6 templates.',
    'Completed Phase 1 of a GoHighLevel audit: merged duplicates, standardized tags and fields.',
    'Built smart lists by program and imported contacts with record counts matched.']],
  ['Digital Marketing Specialist and Client Success Manager','Enlightened Profits &middot; Xfactor Method SaaS','Jun 2022 – Mar 2024',
   ['Ran media buying on Meta, Google, YouTube and TikTok, and built the ads reporting dashboard.',
    'Built 9 lead generation funnels in GoHighLevel and Swipe Pages.',
    'Onboarded 10 clients onto a white-labeled GoHighLevel platform.']]
];

const SKILLS = [
  ['CRM and data', ['GoHighLevel','Google Sheets']],
  ['Course platforms', ['Tevello','Shopify','Kajabi','Teachable','Podia']],
  ['Onboarding and docs', ['ClickUp','Google Sheets','GoHighLevel']],
  ['Content and email', ['Canva','Metricool','LinkedIn']],
  ['AI in daily work', ['Claude','ChatGPT','MCP connectors']],
  ['Operations', ['Mantle','Basecamp','ClickUp','Google Sheets']]
];

const variants = [

/* ---------- A. STACKED ---------- */
() => `<div class="m a1">${HEAD}
  <div class="sec">
    <h2 class="r">Where I've worked</h2>
    ${JOBS.map(([role,org,when,bul]) => `
      <div class="job r"><div class="top"><h3>${role}</h3><span class="when">${when}</span></div>
        <p class="org">${org}</p>
        <div class="cols"><ul class="bul">${bul.map(b=>`<li>${b}</li>`).join('')}</ul></div>
      </div>`).join('')}
  </div>
  <div class="sec">
    <h2 class="r">Selected work</h2>
    <div class="plates">
      ${fig(I.ads,'Meta Ads Manager','Meta ad account','293 campaigns tracked on results, reach, CPM, CPC, CTR and ThruPlays, with the reporting dashboard built alongside it.')}
      ${fig(I.report,'Weekly SaaS report','Weekly SaaS report','Subscriptions, churn and MRR, plus the app listing to trial to paid funnel. It surfaced a churn issue that became a feature recommendation.')}
      ${fig(I.help,'Tevello help center','The help center','All 52 published articles across Get Started, Courses, Communities and Members, with screenshots and tutorial videos.')}
    </div>
  </div>
  <div class="sec">
    <h2 class="r">What I work with</h2>
    <ul class="chips r">${SKILLS.flatMap(([,t])=>t).filter((v,i,a)=>a.indexOf(v)===i).map(t=>`<li>${t}</li>`).join('')}</ul>
  </div>
</div></div>`,

/* ---------- B. SPLIT ---------- */
() => `<div class="m a2">${HEAD}
  <div class="sec split"><h2 class="r">Where I've worked</h2>
    <div>${JOBS.map(([role,org,when,bul]) => `
      <div class="job r"><h3>${role}</h3><p class="org">${org} &middot; <span class="when">${when}</span></p>
        <ul class="bul">${bul.map(b=>`<li>${b}</li>`).join('')}</ul></div>`).join('')}
    </div>
  </div>
  <div class="sec split"><h2 class="r">Selected work</h2>
    <div class="shots">
      ${fig(I.ads,'Meta Ads Manager','Meta ad account','293 campaigns tracked on results, reach, CPM, CPC and ThruPlays.')}
      ${fig(I.report,'Weekly SaaS report','Weekly SaaS report','Subscriptions, churn and MRR from Mantle and Google Sheets.')}
      ${fig(I.help,'Tevello help center','The help center','All 52 articles, with screenshots and tutorial videos.')}
      ${fig(I.click,'ClickUp onboarding templates','Onboarding templates','Member onboarding checklists from 6 ClickUp templates.')}
    </div>
  </div>
  <div class="sec split"><h2 class="r">What I work with</h2>
    <div>${SKILLS.map(([g,t])=>`<div class="skillrow r"><h4>${g}</h4><ul class="chips">${t.map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('')}</div>
  </div>
</div></div>`,

/* ---------- C. BY CLIENT ---------- */
() => `<div class="m a3">${HEAD}
  ${[
    ['Tevello','Digital Marketing and Operations Specialist','Mar 2024 – Oct 2026',JOBS[0][3],
      fig(I.report,'Weekly SaaS report','Weekly SaaS report','Subscriptions, churn and MRR, plus the app listing to trial to paid funnel.') +
      fig(I.help,'Tevello help center','The help center','All 52 published articles, with screenshots and tutorial videos.')],
    ['Bluewater Cruising','CRM and Onboarding Systems Support','Jul 2025 – Oct 2026',JOBS[1][3],
      fig(I.click,'ClickUp onboarding templates','Onboarding templates','Member onboarding checklists from 6 ClickUp templates.')],
    ['Xfactor Method','Digital Marketing Specialist and Client Success Manager','Jun 2022 – Mar 2024',JOBS[2][3],
      fig(I.ads,'Meta Ads Manager','Meta ad account','293 campaigns tracked on results, reach, CPM, CPC, CTR and ThruPlays.')]
  ].map(([name,role,when,bul,shots]) => `
    <div class="client r">
      <div class="head"><h3>${name}</h3><span class="when">${role} &middot; ${when}</span></div>
      <div class="body">
        <ul class="bul">${bul.map(b=>`<li>${b}</li>`).join('')}</ul>
        <div class="shots">${shots}</div>
      </div>
    </div>`).join('')}
  <div class="sec">
    <h2 class="r">What I work with</h2>
    <ul class="chips r">${SKILLS.flatMap(([,t])=>t).filter((v,i,a)=>a.indexOf(v)===i).map(t=>`<li>${t}</li>`).join('')}</ul>
  </div>
</div></div>`
];

/* --- picker wiring (verbatim from PICKER.md) --- */
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}
function mount(i) {
  stage.innerHTML = '';
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
  // Guard: if frames are throttled (background tab), render anyway rather than show blank.
  setTimeout(() => { if (!stage.innerHTML) stage.innerHTML = variants[i](); }, 250);
}
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}
items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});
const requested = parseInt(new URLSearchParams(location.search).get('v'), 10);
setActive(requested >= 1 && requested <= variants.length ? requested - 1 : 0);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
</body>
</html>
