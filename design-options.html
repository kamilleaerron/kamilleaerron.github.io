<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Looser directions — Kamille Aerron De Guzman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:Inter,system-ui,sans-serif;background:#faf8f4;overflow-x:hidden}
  #stage{min-height:100vh}
  img{max-width:100%;display:block}

  /* ---------- PICKER (verbatim from PICKER.md) ---------- */
  .proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
  .proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12)}
  .proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}
  @media (prefers-reduced-motion: reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}}
  .proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit;cursor:pointer;transition:color 150ms ease-out,transform 160ms cubic-bezier(.23,1,.32,1)}
  @media (hover:hover) and (pointer:fine){.proto-picker-item:hover{color:rgba(255,255,255,.85)}}
  .proto-picker-item:active{transform:scale(.97)}
  .proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,.4);outline-offset:2px}
  .proto-picker-item[data-active]{color:#fff}
  .proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,.12)}
  .proto-picker-replay{padding:0 10px;font-size:14px}

  /* ====== your palette, identical in all three ====== */
  .v{--bg:#faf8f4;--ink:#1c1f24;--dim:#5b6270;--accent:#1f5f5b;--accent2:#3f9a92;--sand:#efe9dd;
     background:var(--bg);color:var(--ink);padding-bottom:170px;position:relative}
  .v .bar{display:flex;justify-content:space-between;align-items:center;padding:26px 40px;font-size:14px;color:var(--dim)}
  .v .bar b{color:var(--ink);font-weight:600}
  .v .wrap{max-width:1180px;margin:0 auto;padding:0 40px;position:relative}
  .v h1{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.04em;line-height:.9;margin:0}
  .v .dek{font-size:18px;line-height:1.62;color:var(--dim);max-width:40ch}
  .v .cap b{display:block;font-family:Fraunces,serif;font-size:20px;margin-bottom:6px;font-weight:600}
  .v .cap span{color:var(--dim);font-size:15px;line-height:1.55}
  .v .pill{display:inline-block;background:var(--accent);color:#fff;font-weight:600;font-size:12.5px;padding:7px 14px;border-radius:999px}
  @keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
  .v .r{animation:rise .7s cubic-bezier(.16,1,.3,1) both}
  @media (prefers-reduced-motion:reduce){.v .r{animation:none}.v [data-par]{transform:none!important}}

  /* ---------- 1. COLLAGE: overlap, tilt, varied sizes ---------- */
  .c1 .hero{padding:40px 0 0}
  .c1 h1{font-size:clamp(46px,8.6vw,112px)}
  .c1 .hero .dek{margin:26px 0 0}
  .c1 .board{position:relative;margin:70px 0 0;min-height:1180px}
  .c1 .it{position:absolute;background:#fff;padding:12px 12px 16px;border-radius:3px;box-shadow:0 14px 34px rgba(28,31,36,.13);transition:transform .45s cubic-bezier(.16,1,.3,1),box-shadow .45s}
  .c1 .it img{border-radius:2px}
  .c1 .it .cap{padding:12px 4px 0;max-width:34ch}
  .c1 .it:hover{transform:rotate(0deg) scale(1.022);box-shadow:0 26px 54px rgba(28,31,36,.2);z-index:9}
  .c1 .i1{width:58%;left:0;top:0;transform:rotate(-1.6deg)}
  .c1 .i2{width:40%;right:0;top:300px;transform:rotate(2.1deg)}
  .c1 .i3{width:46%;left:4%;top:620px;transform:rotate(1.1deg)}
  .c1 .i4{width:44%;right:2%;top:830px;transform:rotate(-2.4deg)}
  .c1 .note{position:absolute;left:62%;top:120px;transform:rotate(-3deg);background:var(--sand);padding:20px 22px;border-radius:3px;max-width:230px;font-size:15px;line-height:1.5;color:#4a4034}
  @media(max-width:860px){.c1 .board{min-height:0;display:flex;flex-direction:column;gap:26px}
    .c1 .it,.c1 .note{position:static;width:100%;transform:rotate(0)!important;max-width:none}}

  /* ---------- 2. DRIFT: broken grid, bleeding images, offset text ---------- */
  .c2 h1{font-size:clamp(46px,9.4vw,124px)}
  .c2 .hero{padding:30px 0 0}
  .c2 .hero .dek{margin:30px 0 0 clamp(0px,22vw,300px)}
  .c2 .blk{margin-top:140px;position:relative}
  .c2 .bleedR{margin-right:calc(50% - 50vw)}
  .c2 .bleedL{margin-left:calc(50% - 50vw)}
  .c2 .blk img{border-radius:8px 0 0 8px;width:100%}
  .c2 .bleedL img{border-radius:0 8px 8px 0}
  .c2 .over{position:absolute;z-index:3;font-family:Fraunces,serif;font-weight:600;font-size:clamp(30px,5.4vw,70px);line-height:.95;letter-spacing:-.03em;color:var(--ink);mix-blend-mode:normal}
  .c2 .o1{left:0;top:-42px}
  .c2 .o2{right:3%;top:-42px;text-align:right}
  .c2 .blk .cap{margin-top:26px;max-width:46ch}
  .c2 .blk.right .cap{margin-left:auto;text-align:right}
  .c2 .tools{margin-top:150px;display:flex;flex-wrap:wrap;gap:10px;max-width:60%}
  .c2 .tools span{background:#fff;border-radius:999px;padding:8px 15px;font-size:14.5px;color:var(--dim)}
  @media(max-width:860px){.c2 .hero .dek{margin-left:0}.c2 .over{position:static;margin-bottom:14px}.c2 .bleedR,.c2 .bleedL{margin:0}.c2 .blk img{border-radius:8px}.c2 .tools{max-width:none}.c2 .blk.right .cap{margin-left:0;text-align:left}}

  /* ---------- 3. ALIVE: calm layout, real motion ---------- */
  .c3 h1{font-size:clamp(46px,8.8vw,116px)}
  .c3 .hero{padding:44px 0 0;display:grid;grid-template-columns:1.25fr .75fr;gap:46px;align-items:end}
  .c3 .figs{display:flex;gap:34px;flex-wrap:wrap}
  .c3 .figs b{font-family:Fraunces,serif;font-size:46px;display:block;line-height:1;color:var(--accent)}
  .c3 .figs span{font-size:13px;color:var(--dim);display:block;margin-top:6px;max-width:14ch}
  .c3 .marquee{margin:84px 0 0;overflow:hidden;white-space:nowrap;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
  .c3 .track{display:inline-flex;gap:14px;animation:slide 34s linear infinite}
  @keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @media (prefers-reduced-motion:reduce){.c3 .track{animation:none}}
  .c3 .track span{background:#fff;border-radius:999px;padding:9px 17px;font-size:14.5px;color:var(--dim)}
  .c3 .shot{margin:110px 0 0;perspective:1200px}
  .c3 .shot .frame{border-radius:10px;overflow:hidden;box-shadow:0 20px 50px rgba(28,31,36,.14);transition:transform .5s cubic-bezier(.16,1,.3,1)}
  .c3 .shot:hover .frame{transform:rotateX(2.2deg) rotateY(-2.2deg) scale(1.012)}
  .c3 .shot .cap{margin-top:22px;display:grid;grid-template-columns:1fr 1.5fr;gap:34px}
  @media(max-width:860px){.c3 .hero{grid-template-columns:1fr;gap:26px}.c3 .shot .cap{grid-template-columns:1fr;gap:8px}}
</style>
</head>
<body>

<div id="stage"></div>

<nav class="proto-picker" aria-label="Looser directions">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Collage</button>
  <button class="proto-picker-item">Drift</button>
  <button class="proto-picker-item">Alive</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>

<script>
const I = {
  ads:    'images/xfactor-meta-ads-manager.png',
  report: 'images/a4f5c14f59dd4ba1a0cb78e819d985bd.jpg',
  help:   'images/ccc3aa7cd38f493d93568e855cd219b0.jpg',
  click:  'images/bluewater-onboarding-templates.png',
  me:     'images/0a3ca4527b514f6faa66c4d7bf53a1e9.jpg'
};
const TOOLS = ['GoHighLevel','Shopify','Tevello','Mantle','Google Sheets','ClickUp','Basecamp','Canva','Metricool','Claude','ChatGPT','MCP connectors','Kajabi','Teachable','Podia'];
const BAR = `<div class="bar"><b>Kamille De Guzman</b><span>Marketing operations &middot; Remote, Philippines</span></div>`;

const variants = [

/* ---------- 1. COLLAGE ---------- */
() => `<div class="v c1">${BAR}
  <div class="wrap">
    <div class="hero">
      <h1 class="r">Marketing<br>operations,<br>pinned up.</h1>
      <p class="dek r" style="animation-delay:.1s">Course migrations onto Shopify, help center content, customer stories and the weekly numbers behind them — for founder-led SaaS and online course businesses.</p>
    </div>
    <div class="board">
      <div class="note r" style="animation-delay:.5s">25 customers migrated from 13 platforms. 52 help articles. One weekly report the founder actually reads.</div>
      <div class="it i1 r" style="animation-delay:.18s"><img src="${I.ads}" alt="Meta Ads Manager" loading="lazy"><div class="cap"><b>Meta ad account</b><span>293 campaigns tracked on results, reach, CPM, CPC and ThruPlays.</span></div></div>
      <div class="it i2 r" style="animation-delay:.26s"><img src="${I.click}" alt="ClickUp onboarding templates" loading="lazy"><div class="cap"><b>Onboarding templates</b><span>Member onboarding checklists from 6 ClickUp templates.</span></div></div>
      <div class="it i3 r" style="animation-delay:.34s"><img src="${I.report}" alt="Weekly SaaS report" loading="lazy"><div class="cap"><b>Weekly SaaS report</b><span>Subscriptions, churn and MRR, plus the trial to paid funnel.</span></div></div>
      <div class="it i4 r" style="animation-delay:.42s"><img src="${I.help}" alt="Tevello help center" loading="lazy"><div class="cap"><b>The help center</b><span>All 52 articles, with screenshots and tutorial videos.</span></div></div>
    </div>
  </div>
</div>`,

/* ---------- 2. DRIFT ---------- */
() => `<div class="v c2">${BAR}
  <div class="wrap">
    <div class="hero">
      <h1 class="r">Marketing ops<br>for founder-led<br>SaaS.</h1>
      <p class="dek r" style="animation-delay:.1s">Course migrations onto Shopify, help center content, customer stories, and the weekly numbers behind them.</p>
    </div>

    <div class="blk bleedR r" data-par="0.05">
      <span class="over o1">Meta ad<br>account</span>
      <img src="${I.ads}" alt="Meta Ads Manager" loading="lazy">
      <div class="cap"><b>Xfactor Method</b><span>293 campaigns tracked on results, frequency, reach, CPM, CPC, CTR and ThruPlays, with the reporting dashboard built alongside it in Sheets.</span></div>
    </div>

    <div class="blk right bleedL r" data-par="-0.04">
      <span class="over o2">Weekly<br>SaaS report</span>
      <img src="${I.report}" alt="Weekly SaaS report" loading="lazy">
      <div class="cap"><b>Tevello</b><span>Subscriptions, churn and MRR, plus the app listing to trial to paid funnel. It surfaced a churn issue that became a feature recommendation.</span></div>
    </div>

    <div class="blk bleedR r" data-par="0.05">
      <span class="over o1">The help<br>center</span>
      <img src="${I.help}" alt="Tevello help center" loading="lazy">
      <div class="cap"><b>Tevello</b><span>All 52 published articles across Get Started, Courses, Communities and Members, written with screenshots and tutorial videos.</span></div>
    </div>

    <div class="tools r">${TOOLS.map(t=>`<span>${t}</span>`).join('')}</div>
  </div>
</div>`,

/* ---------- 3. ALIVE ---------- */
() => `<div class="v c3">${BAR}
  <div class="wrap">
    <div class="hero">
      <h1 class="r">Marketing ops<br>that holds up<br>under audit.</h1>
      <div class="figs r" style="animation-delay:.14s">
        <div><b>25</b><span>customers migrated</span></div>
        <div><b>52</b><span>help articles</span></div>
        <div><b>13</b><span>platforms</span></div>
      </div>
    </div>
    <div class="marquee r" style="animation-delay:.22s"><div class="track">${[...TOOLS,...TOOLS].map(t=>`<span>${t}</span>`).join('')}</div></div>

    <div class="shot r" data-par="0.06"><div class="frame"><img src="${I.ads}" alt="Meta Ads Manager" loading="lazy"></div>
      <div class="cap"><b>Meta ad account</b><span>293 campaigns tracked on results, frequency, reach, CPM, CPC, CTR and ThruPlays, with the reporting dashboard built alongside it.</span></div></div>
    <div class="shot r" data-par="0.06"><div class="frame"><img src="${I.report}" alt="Weekly SaaS report" loading="lazy"></div>
      <div class="cap"><b>Weekly SaaS report</b><span>Subscriptions, churn and MRR, plus the app listing to trial to paid funnel. It surfaced a churn issue that became a feature recommendation.</span></div></div>
  </div>
</div>`
];

/* --- picker wiring (verbatim from PICKER.md) --- */
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0, parTargets = [];

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}
function bindParallax() {
  parTargets = [...document.querySelectorAll('[data-par]')];
}
function onScroll() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const h = innerHeight;
  for (const el of parTargets) {
    const r = el.getBoundingClientRect();
    if (r.bottom < -200 || r.top > h + 200) continue;
    const d = (r.top + r.height / 2 - h / 2) * parseFloat(el.dataset.par);
    el.style.transform = `translate3d(0, ${d.toFixed(1)}px, 0)`;
  }
}
function render(i) { stage.innerHTML = variants[i](); bindParallax(); onScroll(); }
function mount(i) {
  stage.innerHTML = '';
  requestAnimationFrame(() => render(i));
  setTimeout(() => { if (!stage.innerHTML) render(i); }, 250);
}
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}
items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', () => { moveHighlight(); onScroll(); });
addEventListener('scroll', () => requestAnimationFrame(onScroll), { passive: true });
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});
const requested = parseInt(new URLSearchParams(location.search).get('v'), 10);
setActive(requested >= 1 && requested <= variants.length ? requested - 1 : 0);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
</body>
</html>
